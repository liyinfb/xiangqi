services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://xiangqi:xiangqi@db:3306/xiangqi
      - JWT_SECRET=local-dev-secret-change-in-production
      - NODE_ENV=development
      - VITE_APP_ID=
      - OAUTH_SERVER_URL=
      - VITE_OAUTH_PORTAL_URL=
      - BUILT_IN_FORGE_API_URL=
      - BUILT_IN_FORGE_API_KEY=
    volumes:
      - ./client:/app/client
      - ./server:/app/server
      - ./drizzle:/app/drizzle
      - ./shared:/app/shared
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pnpm db:push && pnpm dev"

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xiangqi
      MYSQL_USER: xiangqi
      MYSQL_PASSWORD: xiangqi
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
